<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki doğdun!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="clouds" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<!-- 1: pasta -->
<section class="stage" id="stageCake" hidden>
  <p class="eyebrow">25 Ekim</p>
  <h1 id="title1"></h1>
  <svg class="cake" viewBox="0 0 300 250" role="img" aria-label="Doğum günü pastası">
    <ellipse cx="150" cy="232" rx="132" ry="13" fill="#7C9FD6"/>
    <rect x="36" y="142" width="228" height="88" rx="18" fill="#F4F9FF"/>
    <rect x="36" y="142" width="228" height="24" rx="12" fill="#5B9BF0"/>
    <line x1="48" y1="166" x2="240" y2="166" stroke="#5B9BF0" stroke-width="22" stroke-linecap="round" stroke-dasharray="0 24"/>
    <rect x="76" y="92" width="148" height="54" rx="14" fill="#FFFFFF"/>
    <rect x="76" y="92" width="148" height="20" rx="10" fill="#8DBBF8"/>
    <line x1="90" y1="112" x2="210" y2="112" stroke="#8DBBF8" stroke-width="18" stroke-linecap="round" stroke-dasharray="0 24"/>
    <rect x="116" y="56" width="8" height="40" rx="3" fill="#FFD27A"/>
    <rect x="146" y="56" width="8" height="40" rx="3" fill="#FFFFFF"/>
    <rect x="176" y="56" width="8" height="40" rx="3" fill="#FFD27A"/>
    <g class="flame"><circle cx="120" cy="42" r="20" fill="transparent"/><ellipse cx="120" cy="44" rx="6" ry="11" fill="#FFB84D"/><ellipse cx="120" cy="47" rx="3" ry="6" fill="#FFE9A8"/></g>
    <g class="flame"><circle cx="150" cy="42" r="20" fill="transparent"/><ellipse cx="150" cy="44" rx="6" ry="11" fill="#FFB84D"/><ellipse cx="150" cy="47" rx="3" ry="6" fill="#FFE9A8"/></g>
    <g class="flame"><circle cx="180" cy="42" r="20" fill="transparent"/><ellipse cx="180" cy="44" rx="6" ry="11" fill="#FFB84D"/><ellipse cx="180" cy="47" rx="3" ry="6" fill="#FFE9A8"/></g>
  </svg>
  <p class="sub">Bir dilek tut, sonra mumları söndür.</p>
  <button class="btn" id="blow" type="button">🌬️ Üfle</button>
</section>

<!-- 2: mesaj ve hediye -->
<section class="stage" id="stageGift" hidden>
  <h1 id="finalTitle"></h1>
  <button class="gift" id="gift" type="button" aria-label="Hediyeyi aç">🎁</button>
  <p class="sub" id="giftHint">kutuya dokun</p>
  <div class="card" id="giftNote" hidden>
    <p id="giftText"></p>
    <p class="closing" id="closing"></p>
  </div>
</section>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
